spec:
  name: connectwise-manage-mcp
  services:
  - name: connectwise-manage-mcp
    github:
      repo: wyre-technology/connectwise-manage-mcp
      branch: main
      deploy_on_push: true
    source_dir: /
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
    - key: MCP_TRANSPORT
      value: "http"
      scope: RUN_TIME
    - key: NODE_ENV
      value: "production"
      scope: RUN_TIME
    - key: AUTH_MODE
      value: "gateway"
      scope: RUN_TIME
    - key: GATEWAY_HEADER_NAME
      value: "x-cw-gateway-key"
      scope: RUN_TIME
